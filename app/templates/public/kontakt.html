{% extends "base.html" %}
{% block title %}FlyPark - Kontakt{% endblock %}
{% block content %}
<div class="row g-4">
    <div class="col-md-7">
        <h2>Formularz kontaktowy</h2>
        <form action="/kontakt" method="post">
            <div class="mb-3">
                <label class="form-label">Imię</label>
                <input type="text" name="imie" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Nazwisko</label>
                <input type="text" name="nazwisko" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Wiadomość</label>
                <textarea name="wiadomosc" class="form-control" rows="4" required></textarea>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" name="zgoda" class="form-check-input" id="zgoda" required>
                <label class="form-check-label" for="zgoda">Zgoda na przetwarzanie danych osobowych</label>
            </div>
            <button class="btn btn-primary" type="submit">Wyślij</button>
        </form>
    </div>
    <div class="col-md-5">
        <h2>Dane kontaktowe</h2>
        <p>Telefon: +48 123 123 123</p>
        <p>E-mail: kontakt@flypark.pl</p>
        <p>Adres: ul. Ulica 1, 30-123, Kraków</p>
    </div>
</div>
{% endblock %}
