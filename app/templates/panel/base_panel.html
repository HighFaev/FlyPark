<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FlyPark - Panel{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar bg-light border-bottom px-3">
    <a href="/panel" class="navbar-brand d-flex align-items-center">
        <i class="bi bi-airplane-engines fs-3 me-2"></i>FlyPark
    </a>
    <div class="d-flex align-items-center gap-3">
        <span><i class="bi bi-person-circle"></i> {{ session.get("imie") }} {{ session.get("nazwisko") }}</span>
        <a href="/wyloguj" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i> Wyloguj</a>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <aside class="col-md-2 panel-sidebar py-3 border-end min-vh-100">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link {% if active=='pulpit' %}active{% endif %}" href="/panel"><i class="bi bi-house"></i> Pulpit</a></li>
                <li class="nav-item"><a class="nav-link {% if active=='rezerwacje' %}active{% endif %}" href="/panel/rezerwacje"><i class="bi bi-calendar-check"></i> Rezerwacje</a></li>
            </ul>
        </aside>
        <main class="col-md-10 py-4">
            {% with msg = session.pop("flash", None) %}
                {% if msg %}<div class="alert alert-success">{{ msg }}</div>{% endif %}
            {% endwith %}
            {% block content %}{% endblock %}
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
